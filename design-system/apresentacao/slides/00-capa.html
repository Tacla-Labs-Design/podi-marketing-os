<!-- 00-capa — abertura do deck. Cor de marca cheia, logo grande, tagline.
     Texto sobre a cor de marca é sempre var(--ink) — no Podi, branco sobre o verde é proibido.
     O logo é forma, não texto: sobre a cor de marca ele vai branco, pela classe .logo.
     {{TAGLINE}} é fixa por marca: textos.tagline em brand/<marca>/marca.json
     (Podi: "Pensou em Shopping<br>ou Outlet? <strong>Pensou Podi!</strong>"). -->
<style>
.capa{justify-content:center;align-items:flex-start;gap:48px}
.capa__tag{max-width:1100px}
.capa__meta{display:flex;gap:32px;align-items:center;color:var(--ink);opacity:.7;
  font-size:24px;line-height:32px}
</style>
<section class="slide">
  <div class="slide__pad capa">
    <svg class="logo" style="width:520px" viewBox="0 0 263 128" role="img" aria-label="Podi"><title>Podi</title><use href="#logo-marca"/></svg>
    <h1 class="t-capa capa__tag">{{TAGLINE}}</h1>
    <div class="regua"></div>
    <div class="capa__meta">
      <span>{{CLIENTE_OU_AREA}}</span><span>·</span><span>{{MES}} de {{ANO}}</span>
    </div>
  </div>
</section>
