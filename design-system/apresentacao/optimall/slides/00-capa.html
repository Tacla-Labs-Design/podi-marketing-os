<!-- 00-capa — capa roxa do deck do Optimall: logo negativo, frase de abertura em até 3 linhas
     curtas e um subtítulo de até 2 linhas. Pontos lilás nos cantos e o símbolo gigante como
     marca d'água à direita. Troca-se só a frase e o subtítulo (a frase padrão é a assinatura
     aprovada em brand/optimall/mensagens.md). Sem número de slide. -->
<style>
.capa .capa-logo{left:112px;top:112px;width:443px}
.capa .capa-frase{left:112px;top:364px;width:1300px;color:var(--branco);z-index:1}
.capa .capa-sub{left:112px;bottom:112px;width:680px;color:var(--branco-80);font-weight:var(--w-normal);z-index:1}
.capa .capa-simbolo{left:661px;top:64px;width:1669px;height:1106px}
/* Pontos da capa: a máscara do Figma é maior e centrada mais à direita que a padrão. */
.capa .capa-pontos{left:-800px;top:0;
  -webkit-mask-image:radial-gradient(751px 1440px at 50% 0,var(--branco) 0%,var(--branco-0) 95.3%);

.capa .capa-pontos--baixo{left:1120px;top:-120px;

</style>
