<!-- 04-citacao — depoimento de cliente: caixa de vidro escuro com aspas, a frase e o autor,
     sobre o fundo lavanda com o grafismo "Radial Glass"; selo com o símbolo no canto.
     Troca: {{DEPOIMENTO}} (até 5 linhas de ~20 caracteres — frase curta; o resto vai na
     legenda), {{NOME}} e {{CARGO_E_EMPREENDIMENTO}} (1 linha cada).
     Depoimento só entra real e autorizado: sem ele, não use este modelo. -->
<style>
.cit-grafismo{left:0;top:270px;width:1080px;height:1080px;display:block;z-index:0}
.cit-vidro{left:80px;top:80px;width:920px;height:1190px;border-radius:100px;overflow:hidden;z-index:1;
  background:linear-gradient(to bottom,var(--roxo-vidro-1),var(--roxo-vidro-2));
  -webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);color:var(--branco)}
.cit-vidro > *{position:absolute}
.cit-aspas{left:80px;top:80px;width:94px;height:65px;display:block}
.cit-frase{left:75px;top:187px;width:770px}
.cit-autor{left:75px;bottom:91px;width:770px}
.cit-nome{text-transform:uppercase}
.cit-cargo{font-size:30px;line-height:1.2;font-weight:var(--w-medio)}
.cit-selo{left:878.68px;top:1152px;width:151.68px;height:151.68px;border-radius:var(--r-pill);z-index:2;
  background:linear-gradient(188deg,var(--lilas-300) 0%,var(--roxo) 50.4%,var(--roxo-fundo-escuro) 100%)}
.cit-selo::before{content:"";position:absolute;inset:0;border-radius:inherit;
  box-shadow:inset 0 0 26px 2px var(--branco);opacity:.3}
.cit-selo svg{position:absolute;left:37px;top:50px;width:78.42px;height:52px;display:block}
</style>
<section class="post post--lavanda">
  <img class="cit-grafismo" src="assets/post-radial-glass.png" alt="">
  <div class="cit-vidro">
    <svg class="cit-aspas" viewBox="0 0 94 65" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M0 49.451C0 32.9673 3.07592 20.817 9.22775 13C16.1178 4.33333 27.3551 0 42.9398 0V20.3922C32.6047 20.3922 26.5349 25.915 24.7304 36.9608C24.0742 40.5294 23.7461 44.6928 23.7461 49.451V65H0V49.451ZM51.0602 49.451C51.0602 32.9673 54.1361 20.817 60.288 13C67.178 4.33333 78.4154 0 94 0V20.3922C83.6649 20.3922 77.5951 25.915 75.7906 36.9608C75.1344 40.5294 74.8063 44.6928 74.8063 49.451V65H51.0602V49.451Z" fill="currentColor"/></svg>
    <blockquote class="t-citacao cit-frase">{{DEPOIMENTO}}</blockquote>
    <div class="cit-autor">
      <p class="t-autor cit-nome">{{NOME}}</p>
      <p class="cit-cargo">{{CARGO_E_EMPREENDIMENTO}}</p>
    </div>
  </div>
  <div class="cit-selo" aria-hidden="true"><svg viewBox="0 0 36.2 24"><use href="#logo-optimall-negativo" width="143" height="24"/></svg></div>
</section>
