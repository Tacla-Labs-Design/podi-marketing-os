<!-- 00-capa — abertura do deck. Verde cheio, ripple em volta do logo, tagline e o app na mão.
     Layout do arquivo "[DECK] Simple Deck - Podi" no Figma. Posições em px do canvas: não mexer.
     Texto sobre o verde: a tagline é var(--accent-deep), 5,2:1 — branco sobre o verde é proibido.
     O logo é forma, não texto: sobre o verde ele vai branco, pela classe .logo.
     A tagline é fixa: textos.tagline em brand/marca.json.
     Ativos fixos (copiar de brand/assets/deck/ para assets/): ripple-podi.svg, mao-celular.png,
     tela-app-nota.png, tela-app-campanha.png. As duas telas podem trocar por outra tela do app
     em 1:2,17 (393 × 852). -->
<style>
.capa{display:block}
.capa .ripple{left:-840px;top:-682px;width:2592px}
.capa .tela{width:344px;height:737px}
.capa__tela-a{left:884px;top:74px}
.capa__tela-b{left:1510px;top:267px}
.capa__mao{position:absolute;left:483px;top:-37px;width:1804px;display:block}
.capa__logo{position:absolute;left:282px;top:431px;width:425px}
.capa__tag{position:absolute;left:0;top:873px;width:989px;text-align:center;color:var(--accent-deep)}
</style>
<section class="slide capa">
  <img class="ripple" src="assets/ripple-podi.svg" alt="">
  <div class="tela capa__tela-b"><img src="assets/tela-app-nota.png" alt="Tela do app Podi: nota fiscal enviada"></div>
  <div class="tela capa__tela-a"><img src="assets/tela-app-campanha.png" alt="Tela do app Podi: campanha de Natal do shopping"></div>
  <img class="capa__mao" src="assets/mao-celular.png" alt="Mão segurando o celular com o app Podi aberto">
  <svg class="logo capa__logo" viewBox="0 0 263 128" role="img" aria-label="Podi"><title>Podi</title><use href="#logo-marca"/></svg>
  <p class="t-tagline capa__tag">{{TAGLINE}}</p>
</section>
