<!-- 13-citacao — derivado da caixa de vidro do Post-04 (arquivo de posts), adaptada a 1920×1080
     sobre o fundo roxo da capa (pontos + símbolo gigante). Não há frame próprio no deck.
     Depoimento de cliente: aspas, frase de até ~30 palavras (4 linhas), nome e cargo + empreendimento.
     Só entra depoimento REAL e autorizado, com nome e cargo (brand/optimall/mensagens.md):
     troque {{DEPOIMENTO}}, {{NOME}} e {{CARGO_E_EMPREENDIMENTO}}; sem depoimento real, não use o slide. -->
<style>
.ct-marca{left:760px;top:40px;width:1669px;height:auto}
.ct-caixa{left:80px;top:80px;width:1760px;height:920px;border-radius:var(--r-painel);overflow:hidden;
  -webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);z-index:2}
.ct-caixa > *{position:absolute}
.ct-aspas{left:120px;top:112px;width:122px;height:auto;color:var(--branco)}
.ct-frase{left:120px;top:248px;width:1400px;font-size:72px;line-height:1.1;font-weight:var(--w-semi);letter-spacing:-0.02em;color:var(--branco)}
.ct-autor{left:120px;bottom:104px;display:flex;flex-direction:column;gap:4px;color:var(--branco)}
.ct-nome{font-size:28px;line-height:1.2;font-weight:var(--w-semi);letter-spacing:.05em;text-transform:uppercase}
.ct-cargo{font-size:28px;line-height:1.2;font-weight:var(--w-livro);color:var(--branco-90)}
.ct-logo{right:120px;bottom:112px}
</style>
<section class="slide slide--roxo">
  <div class="pontos pontos--sobre-roxo" style="left:-800px;top:0"></div>
  <img class="marca-dagua ct-marca" src="assets/simbolo-gigante.svg" alt="" aria-hidden="true">

  <figure class="vidro ct-caixa">
    <!-- aspas: grafismo do Post-04 -->
    <svg class="ct-aspas" viewBox="0 0 94 65" fill="none" aria-hidden="true"><path d="M0 49.451C0 32.9673 3.07592 20.817 9.22775 13C16.1178 4.33333 27.3551 0 42.9398 0V20.3922C32.6047 20.3922 26.5349 25.915 24.7304 36.9608C24.0742 40.5294 23.7461 44.6928 23.7461 49.451V65H0V49.451ZM51.0602 49.451C51.0602 32.9673 54.1361 20.817 60.288 13C67.178 4.33333 78.4154 0 94 0V20.3922C83.6649 20.3922 77.5951 25.915 75.7906 36.9608C75.1344 40.5294 74.8063 44.6928 74.8063 49.451V65H51.0602V49.451Z" fill="currentColor"/></svg>
    <blockquote class="ct-frase">{{DEPOIMENTO}}</blockquote>
    <figcaption class="ct-autor">
      <span class="ct-nome">{{NOME}}</span>
      <span class="ct-cargo">{{CARGO_E_EMPREENDIMENTO}}</span>
    </figcaption>
    <svg class="logo ct-logo" style="width:286px" viewBox="0 0 143 24" role="img" aria-label="Optimall"><title>Optimall</title><use href="#logo-optimall-negativo"/></svg>
  </figure>
  <span class="num-slide">13</span>
</section>
