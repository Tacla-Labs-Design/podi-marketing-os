<!-- 06 · CARD OFERTA / PRODUTO — título, preço, CTA, letra miúda e imagem ao pé. -->
<tr>
  <td class="p-mobile" style="padding:0 32px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#FFFFFF" class="dm-surface" style="width:100%;background-color:#FFFFFF;border-radius:20px;">
      <tr>
        <td align="center" class="card-mobile" style="padding:36px 32px 8px 32px;">
          <h3 class="t-h3 dm-ink" style="margin:0 0 10px 0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:22px;line-height:28px;font-weight:600;color:#101010;text-align:center;">{{TITULO}}</h3>
          <p class="dm-body" style="margin:0 0 22px 0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:24px;font-weight:400;color:#4A4A4A;text-align:center;">{{PRECO_OU_SUBTITULO}}</p>
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
            <tr>
              <td align="center" bgcolor="#31D06E" style="border-radius:100px;">
                <!--[if mso]>
                <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{URL_CTA}}" style="height:44px;v-text-anchor:middle;width:190px;" arcsize="50%" stroke="f" fillcolor="#31D06E">
                  <w:anchorlock/>
                  <center style="color:#101010;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;">{{LABEL_CTA}}</center>
                </v:roundrect>
                <![endif]-->
                <!--[if !mso]><!-->
                <a href="{{URL_CTA}}" target="_blank" style="display:inline-block;padding:14px 28px;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:16px;font-weight:600;color:#101010;text-decoration:none;border-radius:100px;background-color:#31D06E;mso-hide:all;">{{LABEL_CTA}}</a>
                <!--<![endif]-->
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td align="center" style="padding:20px 32px 0 32px;">
          <p class="dm-muted" style="margin:0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:19px;font-weight:400;color:#6E6E6E;text-align:center;">{{LETRA_MIUDA}}</p>
        </td>
      </tr>
      <tr>
        <td align="center" style="padding:24px 24px 24px 24px;">
          <img src="{{URL_IMAGEM}}" width="488" alt="{{ALT}}" style="display:block;border:0;outline:none;text-decoration:none;width:100%;max-width:488px;height:auto;" />
        </td>
      </tr>
    </table>
  </td>
</tr>
