<style type="text/css">
  /* ---------- sempre modo claro ----------
     Modo empreendimento: os tokens de dark mode são derivados do verde Podi e ainda não
     existe regra para derivá-los de outra cor. Por isso não há bloco de dark mode nem
     classes dm-*. Limitação: o app do Gmail e parte das versões do Outlook podem inverter
     as cores por conta própria, ignorando este aviso. */
  :root { color-scheme:light only; supported-color-schemes:light; }

  /* ---------- resets de client ---------- */
  html, body { margin:0 !important; padding:0 !important; height:100% !important; width:100% !important; }
  body { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
  table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; border-collapse:collapse; }
  img { -ms-interpolation-mode:bicubic; border:0; height:auto; line-height:100%; outline:none; text-decoration:none; }
  a { text-decoration:none; }
  #outlook a { padding:0; }
  .ExternalClass, .ExternalClass p, .ExternalClass span, .ExternalClass font, .ExternalClass td, .ExternalClass div { line-height:inherit; }
  u + #body a, #MessageViewBody a { color:inherit; text-decoration:none; font-size:inherit; font-family:inherit; font-weight:inherit; line-height:inherit; }
  .im { color:inherit !important; }

  /* ---------- mobile ---------- */
  @media only screen and (max-width:600px) {
    .w-full      { width:100% !important; max-width:100% !important; }
    .stack       { display:block !important; width:100% !important; max-width:100% !important; }
    .stack img   { width:100% !important; max-width:100% !important; }
    .p-mobile    { padding-left:20px !important; padding-right:20px !important; }
    .card-mobile { padding:24px 20px !important; }
    .full-bleed  { padding-left:0 !important; padding-right:0 !important; }
    .full-bleed img { border-radius:0 !important; }
    .center-mobile { text-align:center !important; }
    .h-mobile    { height:24px !important; line-height:24px !important; }
    .hide-mobile { display:none !important; }
    .thumb-cell  { width:88px !important; }
    .thumb       { width:88px !important; max-width:88px !important; height:88px !important; }
    .thumb-gap   { width:16px !important; }
    .t-hero      { font-size:26px !important; line-height:33px !important; }
    .t-h2        { font-size:23px !important; line-height:29px !important; }
    .t-h3        { font-size:19px !important; line-height:25px !important; }
    .order-img   { display:table-header-group !important; }
  }

</style>
</head>
