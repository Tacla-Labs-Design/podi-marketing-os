<!-- ============================================================================
     BOTÃO CTA (pill) — duas variantes. Escolher UMA por seção.
     Ajustar sempre a largura do <v:roundrect> (width ≈ nº de caracteres * 9 + 56).

     {{URL}} entra nos DOIS lugares: no <v:roundrect> (MSO) e no <a>. Esquecer um
     deles deixa o botão morto em metade dos clients.

     Se o CTA for o download do app Podi, a URL é fixa:
     https://podi.podiapp.com.br/podi-e931a  (brand/links-oficiais.md)
     ============================================================================ -->

<!-- VARIANTE A · CTA PRIMÁRIO — verde de marca com texto PRETO.
     Texto branco sobre #48DB84 dá 1,78:1 de contraste e é proibido.
     Não leva .dm-btn: o verde já contrasta o bastante no dark mode. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
  <tr>
    <td align="center" bgcolor="#48DB84" style="border-radius:100px;">
      <!--[if mso]>
      <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{URL}}" style="height:46px;v-text-anchor:middle;width:240px;" arcsize="50%" stroke="f" fillcolor="#48DB84">
        <w:anchorlock/>
        <center style="color:#101010;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;">{{LABEL}}</center>
      </v:roundrect>
      <![endif]-->
      <!--[if !mso]><!-->
      <a href="{{URL}}" target="_blank" style="display:inline-block;padding:15px 30px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:16px;font-weight:600;color:#101010;text-decoration:none;border-radius:100px;background-color:#48DB84;mso-hide:all;">{{LABEL}}</a>
      <!--<![endif]-->
    </td>
  </tr>
</table>

<!-- VARIANTE B · CTA SECUNDÁRIO — neutro escuro. Usar quando o verde já aparece
     forte na seção. Precisa da classe .dm-btn nos dois elementos, senão vira
     preto sobre preto no dark mode. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
  <tr>
    <td align="center" bgcolor="#101010" class="dm-btn" style="border-radius:100px;">
      <!--[if mso]>
      <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{URL}}" style="height:46px;v-text-anchor:middle;width:240px;" arcsize="50%" stroke="f" fillcolor="#101010">
        <w:anchorlock/>
        <center style="color:#FFFFFF;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;">{{LABEL}}</center>
      </v:roundrect>
      <![endif]-->
      <!--[if !mso]><!-->
      <a href="{{URL}}" target="_blank" class="dm-btn" style="display:inline-block;padding:15px 30px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:16px;font-weight:600;color:#FFFFFF;text-decoration:none;border-radius:100px;background-color:#101010;mso-hide:all;">{{LABEL}}</a>
      <!--<![endif]-->
    </td>
  </tr>
</table>
