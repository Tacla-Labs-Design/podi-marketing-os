<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITULO_DA_APRESENTACAO}}</title>
<style>
/* ---------------------------------------------------------------------------
   TOKENS — design-system/apresentacao/optimall/tokens.md
   Deck do Optimall: nasce nesta paleta. NÃO passa pelo aplicar-marca.py.
   Nunca escrever cor solta nos slides: tudo por var(--token).
   --------------------------------------------------------------------------- */
:root{
  /* marca */
  --roxo:#9934FF;            /* cor da marca: fundo, chip, ícone, grafismo */
  --roxo-texto:#9025F4;      /* roxo quando é TEXTO sobre fundo claro (4,5:1+) */
  --roxo-luz:#AD5CFF;        /* centro do degradê radial do fundo roxo */
  --roxo-700:#821FE5;        /* destaque em título, pílula de número */
  --roxo-500:#A855F7;        /* régua, ponto de status, conector */
  --roxo-sombra:#4F009E;     /* só no símbolo gigante (marca d'água) */
  --disco-meio:#AB57FF;      /* disco do símbolo */
  --disco-borda:#BC7AFF;

  /* lilases e lavandas — fundos claros e grafismo */
  --lilas-400:#C084FC;       /* pontos sobre roxo, tag grande, linha tracejada */
  --lilas-300:#D8B4FE;       /* pontos, tag de status */
  --lilas-200:#E9D5FF;       /* tag, chip claro, pontos, borda de card */
  --lilas-borda:#E6CCFF;     /* borda de grade e de card */
  --lavanda:#F3E8FF;         /* borda do degradê claro, painel de lista */
  --lavanda-50:#FAF5FF;

  /* neutros */
  --branco:#FFFFFF;
  --titulo-1:#353E4F;        /* degradê do título sobre claro */
  --titulo-2:#525A6F;
  --tinta:#181D27;           /* título de card */
  --texto:#374151;           /* corpo sobre claro */
  --apoio:#525A6F;           /* corpo de card, legenda */
  --borda-card:#E2E8F0;
  --borda-device:#E5E5E5;

  /* transparências (sempre derivadas do branco ou do roxo da marca) */
  --branco-90:rgba(255,255,255,.9);
  --branco-80:rgba(255,255,255,.8);
  --branco-15:rgba(255,255,255,.15);
  --branco-12:rgba(255,255,255,.12);
  --branco-10:rgba(255,255,255,.10);
  --branco-0:rgba(255,255,255,0);
  --roxo-10:rgba(153,52,255,.10);
  --roxo-07:rgba(153,52,255,.07);
  --roxo-0:rgba(153,52,255,0);
  --sombra:rgba(22,52,80,.1);

  /* degradês */
  --fundo-roxo:radial-gradient(812px 812px at 168px 172px,var(--roxo-luz) 0%,var(--roxo) 100%);
  --fundo-claro:radial-gradient(1175px 1175px at 1131px 890px,var(--branco-0) 0%,var(--lavanda) 100%),var(--branco);
  --fundo-claro-2:radial-gradient(1317px 1317px at 652px 375px,var(--branco-0) 0%,var(--lavanda) 100%),var(--branco);
  --titulo-degrade:linear-gradient(45deg,var(--titulo-1) 0.5%,var(--titulo-2) 100%);
  --regua:linear-gradient(to right,var(--roxo-500),rgba(168,85,247,0));
  --regua-centro:linear-gradient(to right,rgba(168,85,247,0),var(--roxo-500) 50%,rgba(168,85,247,0));
  --regua-branca:linear-gradient(to right,var(--branco),var(--branco-0));
  --disco:radial-gradient(circle at 0 0,var(--roxo) 0%,var(--disco-meio) 50%,var(--disco-borda) 100%);

  /* forma */
  --r-pill:9999px;
  --r-painel:72px;
  --r-card:48px;
  --r-card-md:42px;
  --r-card-sm:32px;
  --r-chip:24px;
  --r-chip-sm:20px;
  --safe:64px;

  /* tipografia — Halyard Text, instalada na máquina (Adobe Fonts) */
  --font:'Halyard Text','Helvetica Neue',Arial,sans-serif;
  --w-livro:350;      /* Halyard "Book" */
  --w-normal:400;
  --w-medio:500;
  --w-semi:600;
  --w-negrito:700;
}

*{box-sizing:border-box;margin:0;padding:0}
.slide *{min-width:0}
html,body{background:#2A2A2A;font-family:var(--font);-webkit-font-smoothing:antialiased}

/* --- o canvas fixo ------------------------------------------------------- */
.stage{margin:0 auto}
.deck{width:1920px;transform-origin:top left}
.slide{
  position:relative;width:1920px;height:1080px;overflow:hidden;isolation:isolate;
  background:var(--fundo-claro);color:var(--texto);font-family:var(--font);
  margin:0 0 40px;
}
.slide:last-child{margin-bottom:0}
.slide > *{position:absolute}

/* --- fundos -------------------------------------------------------------- */
.slide--roxo{background:var(--fundo-roxo);color:var(--branco)}
.slide--claro{background:var(--fundo-claro)}
.slide--claro-2{background:var(--fundo-claro-2)}
.slide--branco{background:var(--branco)}

/* --- grafismos ----------------------------------------------------------- */
/* Pattern de pontos: 2,5px a cada 19,17px, sumindo em direção ao centro.
   Posição e tamanho vêm do slide; a cor, da variante. */
.pontos{width:1600px;height:1200px;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,var(--pontos-cor,var(--lilas-300)) 1.25px,transparent 1.5px);
  background-size:19.1667px 19.1667px;background-position:-5px -5px;
  -webkit-mask-image:radial-gradient(626px 1200px at 50% 0,#000 0%,transparent 95%);
          mask-image:radial-gradient(626px 1200px at 50% 0,#000 0%,transparent 95%);
  -webkit-mask-size:1440px 1440px;mask-size:1440px 1440px;
  -webkit-mask-position:80px 0;mask-position:80px 0;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.pontos--baixo{-webkit-mask-image:radial-gradient(626px 1200px at 50% 100%,#000 0%,transparent 95%);
          mask-image:radial-gradient(626px 1200px at 50% 100%,#000 0%,transparent 95%);
  -webkit-mask-position:80px -240px;mask-position:80px -240px}
.pontos--sobre-roxo{--pontos-cor:var(--lilas-400)}
.pontos--200{--pontos-cor:var(--lilas-200)}
.pontos--300{--pontos-cor:var(--lilas-300)}

/* Anéis concêntricos: roxo 7% → transparente, de cima para baixo. */
.aneis{border-radius:50%;z-index:0;pointer-events:none}
.aneis,.aneis::before,.aneis::after{background:linear-gradient(to bottom,var(--roxo-07),var(--roxo-0))}
.aneis::before,.aneis::after{content:"";position:absolute;border-radius:50%}
.aneis::before{inset:12%}
.aneis::after{inset:26%}

/* Símbolo gigante (marca d'água sobre o roxo): assets/simbolo-gigante.svg */
.marca-dagua{z-index:0;pointer-events:none;display:block}

/* Disco do símbolo */
.disco{border-radius:var(--r-pill);background:var(--disco);display:flex;align-items:center;justify-content:center;z-index:2}

/* --- tipografia ---------------------------------------------------------- */
.t-capa{font-size:96px;line-height:1.2;font-weight:var(--w-normal);letter-spacing:-0.02em}
.t-fecho{font-size:88px;line-height:1.2;font-weight:var(--w-normal);letter-spacing:-0.02em}
.t-titulo{font-size:72px;line-height:1.1;font-weight:var(--w-semi);letter-spacing:-0.01em;
  background:var(--titulo-degrade);-webkit-background-clip:text;background-clip:text;color:transparent}
.slide--roxo .t-titulo{background:none;color:var(--branco)}
.t-titulo-md{font-size:64px;line-height:1.1;font-weight:var(--w-semi);letter-spacing:-0.01em;color:var(--texto)}
.t-destaque{color:var(--roxo-700)}
.t-sub{font-size:32px;line-height:1.4;font-weight:var(--w-livro);color:var(--branco-90)}
.t-lead{font-size:28px;line-height:1.4;font-weight:var(--w-medio);color:var(--texto)}
.t-corpo{font-size:28px;line-height:1.4;font-weight:var(--w-livro);color:var(--texto)}
.t-corpo-sm{font-size:24px;line-height:1.5;font-weight:var(--w-livro);color:var(--texto)}
.t-item{font-size:24px;line-height:1.3;font-weight:var(--w-livro);color:var(--texto)}
.t-card{font-size:32px;line-height:1.2;font-weight:var(--w-medio);color:var(--tinta)}
.t-card-sm{font-size:28px;line-height:1.3;font-weight:var(--w-semi);color:var(--titulo-1)}
.t-card-corpo{font-size:28px;line-height:1.4;font-weight:var(--w-livro);color:var(--apoio)}
.t-card-corpo-sm{font-size:24px;line-height:1.5;font-weight:var(--w-livro);color:var(--apoio)}
.t-num{font-size:80px;line-height:1.2;font-weight:var(--w-normal);letter-spacing:-0.02em}
.t-num-pre{font-size:48px;line-height:1.2;font-weight:var(--w-medio)}
.t-num-label{font-size:32px;line-height:1.2;font-weight:var(--w-normal);color:var(--branco-80)}
.t-rotulo{font-size:18px;line-height:1.4;font-weight:var(--w-semi);letter-spacing:.05em;text-transform:uppercase}
.slide--roxo .t-corpo,.slide--roxo .t-lead{color:var(--branco)}
b,strong{font-weight:var(--w-semi)}

/* --- tag (eyebrow) ------------------------------------------------------- */
.tag{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:var(--r-pill);
  background:var(--lilas-200);color:var(--roxo-texto);
  font-size:16px;line-height:1.1;font-weight:var(--w-semi);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.tag--status{background:var(--lilas-300);color:var(--branco)}
.tag--status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--roxo-500)}
.tag--lg{background:var(--lilas-400);color:var(--branco);font-size:18px}

/* --- réguas -------------------------------------------------------------- */
.regua{width:400px;height:4px;border-radius:48px 0 0 48px;background:var(--regua);flex:none}
.regua--centro{background:var(--regua-centro);margin:0 auto}
.slide--roxo .regua{background:var(--regua-branca)}

/* --- chips de ícone ------------------------------------------------------ */
/* Ícone: HugeIcons bulk (assets de brand/optimall/assets/icones-ui/), sempre em currentColor. */
.chip{flex:none;display:flex;align-items:center;justify-content:center;
  width:80px;height:80px;border-radius:var(--r-chip);background:var(--roxo);color:var(--branco);
  border:2px solid var(--branco-12)}
.chip svg{width:53%;height:53%;display:block}
.chip--lg{width:120px;height:120px;border-radius:40px}
.chip--xl{width:112px;height:112px;border-radius:28px}
.chip--claro{width:64px;height:64px;padding:12px;border-radius:var(--r-chip-sm);background:var(--lilas-200);color:var(--roxo);border:0}
.chip--claro svg{width:32px;height:32px}
.chip--claro-sm{width:56px;height:56px}
.chip--claro-xs{width:48px;height:48px;padding:8px}
.chip--branco{width:104px;height:104px;border-radius:30px;background:var(--branco);color:var(--roxo);border:0;
  box-shadow:9px 27px 99px -13px var(--sombra)}

/* --- superfícies --------------------------------------------------------- */
.card{background:var(--branco);border-radius:var(--r-card);padding:32px}
.card--borda{border:2px solid var(--lilas-200);border-radius:var(--r-card-md)}
.card--sombra{box-shadow:7px 22px 80px -10px var(--sombra)}
.vidro{background:linear-gradient(to bottom,var(--branco-15),rgba(153,153,153,.15))}
.painel-lista{background:linear-gradient(to bottom,var(--lavanda),rgba(243,232,255,0));border-radius:0 40px 40px 0;
  padding:48px 80px 48px 64px}

/* Moldura de tela (painel web): branca, borda fina, raio 40 */
.device{background:var(--branco);border:1px solid var(--borda-device);border-radius:40px;padding:9px;overflow:hidden}
.device img{display:block;width:100%;height:100%;object-fit:cover;object-position:top left;border-radius:32px}

/* --- logo ----------------------------------------------------------------
   Tricolor, duas versões oficiais: positivo (fundo claro) e negativo (fundo roxo).
   Nunca recolorir, nunca filter, nunca currentColor. */
.logo{display:block;height:auto;flex:none}

/* --- rodapé: número do slide -------------------------------------------- */
.num-slide{right:64px;bottom:40px;font-size:20px;line-height:1;color:var(--apoio);opacity:.75}
.slide--roxo .num-slide{color:var(--branco)}

/* --- preview na tela e export em PDF ------------------------------------- */
@media screen{ body{padding:40px 0} }
@page{size:1920px 1080px;margin:0}
@media print{
  html,body{background:#fff;padding:0;display:block}
  .deck{transform:none !important}
  .stage{width:auto !important;height:auto !important;margin:0}
  .slide{margin:0;break-after:page;page-break-after:always}
  .slide:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>

<script>
/* Escala o canvas de 1920px para caber na janela. Não roda na impressão. */
(function(){
  var deck=document.getElementById('deck'),stage=document.getElementById('stage');
  function ajustar(){
    var s=Math.min(1,(window.innerWidth-80)/1920);
    deck.style.transform='scale('+s+')';
    stage.style.width=(1920*s)+'px';
    stage.style.height=(deck.scrollHeight*s)+'px';
  }
  window.addEventListener('resize',ajustar);
  window.addEventListener('load',ajustar);
  ajustar();
})();
</script>
