<!-- 02a · EYEBROW / TAG — pílula com a cor de marca acima da headline.
     Fundo #D4F0DF + texto #0C6E3B. A classe .dm-tag ajusta o fundo no dark mode. -->
<tr>
  <td align="center" class="p-mobile" style="padding:0 32px 16px 32px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
      <tr>
        <td align="center" bgcolor="#D4F0DF" class="dm-tag" style="border-radius:100px;padding:7px 14px;">
          <span class="dm-accent" style="font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:16px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#0C6E3B;">{{TAG}}</span>
        </td>
      </tr>
    </table>
  </td>
</tr>
