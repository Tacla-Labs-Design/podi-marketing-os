<!-- _slide — shell de um slide. Todo tipo começa daqui.
     Variantes de fundo: (nenhuma)=verde · slide--light · slide--white · slide--dark
     Nada de conteúdo fora do .slide__pad: os 96px são a margem de segurança do projetor. -->
<section class="slide">
  <div class="slide__pad">

    <!-- conteúdo -->

    <!-- Rodapé: o logo assina, não a palavra. Em fundo claro, trocar por
         class="logo logo--marca". -->
    <div class="slide__foot">
      <svg class="logo" viewBox="0 0 263 128" role="img" aria-label="Podi"><title>Podi</title><use href="#logo-marca"/></svg>
      <span>00</span>
    </div>
  </div>
</section>
