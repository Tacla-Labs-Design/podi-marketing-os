<!-- ============================================================================
     90b · REDES SOCIAIS COM LOGO — logo à esquerda, ícones à direita, numa linha só.
     Alternativa ao 90-social (ícones centralizados). Usar UMA das duas variantes
     abaixo, no lugar do 90-social, logo antes do 91-footer-legal.

     Não empilha no mobile, de propósito: logo de até 150px + 3 ícones com gap de 16px
     dá 270px, e cabe nos 280px úteis de uma tela de 320px. Com 4 ícones, o logo do
     empreendimento precisa ter no máximo 110px de largura.

     Ícones: variante `-green` de brand/assets/icones/, 24x24 (arquivo 44x44), com o
     nome da rede no `alt` — mesmas regras do 90-social. Remover a <td> da rede que
     não for usada.
     ============================================================================ -->
