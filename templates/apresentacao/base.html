<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITULO_DA_APRESENTACAO}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   TOKENS — design-system/apresentacao/tokens.md
   Valores do Podi. Deck de outra marca: montar igual e rodar
   scripts/aplicar-marca.py aplicar <marca>, que troca este bloco e o <symbol> do logo.
   Nunca escrever cor solta nos slides.
   --------------------------------------------------------------------------- */
:root{
  /* marca */
  --accent:#48DB84;          /* só fundo — nunca color: */
  --accent-ink:#0C6E3B;      /* marca em texto, sobre fundo claro */
  --accent-on-dark:#6FE9A2;  /* marca em texto, sobre o fundo preto */

  /* secundária — só detalhe gráfico */
  --accent-2:#9934FF;
  --accent-2-mid:#C58CFF;
  --accent-2-soft:#E9DBFF;
  --accent-2-line:#E0CCFA;

  /* fundos */
  --page:#48DB84;
  --page-light:#EDF7F1;
  --surface:#FFFFFF;
  --surface-alt:#F6FAF7;
  --hairline:#D2E7DA;
  --ink-field:#101010;

  /* texto */
  --ink:#101010;
  --body:#4A4A4A;
  --muted:#6E6E6E;
  --ink-inverse:#FFFFFF;

  /* forma */
  --r-card:32px;
  --r-card-sm:24px;
  --r-img:24px;
  --r-chip:20px;
  --r-pill:100px;
  --safe:96px;

  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
/* Item de grid/flex tem min-width:auto por padrão: um texto grande empurra a
   coluna para fora do canvas em vez de quebrar. Num canvas fixo isso é corte. */
.slide *{min-width:0}
html,body{background:#2A2A2A;font-family:var(--font);-webkit-font-smoothing:antialiased}

/* --- o canvas fixo ------------------------------------------------------- */
.stage{margin:0 auto}
.deck{width:1920px;transform-origin:top left}
.slide{
  position:relative;width:1920px;height:1080px;overflow:hidden;
  background:var(--page);color:var(--ink);
  display:flex;flex-direction:column;
  margin:0 0 40px;
}
.slide:last-child{margin-bottom:0}
.slide__pad{flex:1;display:flex;flex-direction:column;padding:var(--safe)}

/* --- tipografia ---------------------------------------------------------- */
.t-capa{font-size:96px;line-height:104px;font-weight:700;letter-spacing:-2px}
.t-slide{font-size:64px;line-height:72px;font-weight:700;letter-spacing:-1px}
.t-sub{font-size:32px;line-height:44px;font-weight:400;color:var(--body)}
.t-card{font-size:40px;line-height:48px;font-weight:700}
.t-card-sm{font-size:32px;line-height:40px;font-weight:700}
.t-body{font-size:28px;line-height:40px;font-weight:400;color:var(--body)}
.t-body-sm{font-size:24px;line-height:34px;font-weight:400;color:var(--body)}
.t-num{font-size:88px;line-height:96px;font-weight:700;letter-spacing:-2px}
.t-num-label{font-size:24px;line-height:32px;font-weight:400;color:var(--body)}
.t-eyebrow{font-size:20px;line-height:26px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.t-legenda{font-size:20px;line-height:28px;font-weight:400;color:var(--muted)}

/* --- detalhes roxos ------------------------------------------------------ */
.regua{width:120px;height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--accent-2) 0%,var(--accent-2-mid) 100%)}
.chip{width:88px;height:88px;border-radius:var(--r-chip);background:var(--accent-2-soft);
  display:flex;align-items:center;justify-content:center;color:var(--accent-2)}
.chip svg{width:40px;height:40px;display:block}

/* --- superfícies --------------------------------------------------------- */
.card{background:var(--surface);border-radius:var(--r-card);padding:48px}
.card--lg{padding:64px}

/* --- logo ----------------------------------------------------------------
   O logo vem de brand/<marca>/assets/header/ (SVG monocromático): a cor sai do
   CSS por `currentColor`. Sobre a cor de marca e sobre o preto ele vai branco;
   sobre fundo branco vai na cor de marca. Nunca recolorir o arquivo, nunca filter. */
.logo{display:block;height:auto;fill:currentColor;color:var(--ink-inverse);flex:none}
.logo--marca{color:var(--accent)}      /* qualquer fundo claro, em qualquer tamanho */

/* --- rodapé do slide -----------------------------------------------------
   A assinatura do rodapé é o logo, não o nome da marca escrito. A opacidade fica nos
   spans, nunca no container: logo apagado não assina nada. */
.slide__foot{display:flex;justify-content:space-between;align-items:center;gap:32px;
  font-size:20px;line-height:20px;color:var(--muted);padding-top:32px}
.slide__foot span{opacity:.75}
.slide__foot .logo{width:72px}

/* --- variantes de fundo -------------------------------------------------- */
.slide--light{background:var(--page-light)}
.slide--white{background:var(--surface)}
.slide--dark{background:var(--ink-field);color:var(--ink-inverse)}
.slide--dark .t-sub,.slide--dark .t-body,.slide--dark .t-legenda{color:#C9C9C9}

/* --- preview na tela e export em PDF ------------------------------------- */
@media screen{ body{padding:40px 0} }
@page{size:1920px 1080px;margin:0}
@media print{
  html,body{background:#fff;padding:0;display:block}
  .deck{transform:none !important}
  .stage{width:auto !important;height:auto !important;margin:0}
  .slide{margin:0;break-after:page;page-break-after:always}
  .slide:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>

<div class="stage" id="stage">
<div class="deck" id="deck">

  <!-- ======================================================================
       COLE AQUI OS SLIDES, na ordem do roteiro.
       Fonte: design-system/apresentacao/slides/
       Cada arquivo de lá é um <section class="slide"> completo.
       ====================================================================== -->

</div>
</div>

<script>
/* Escala o canvas de 1920px para caber na janela. Não roda na impressão. */
(function(){
  var deck=document.getElementById('deck'),stage=document.getElementById('stage');
  function ajustar(){
    var s=Math.min(1,(window.innerWidth-80)/1920);
    deck.style.transform='scale('+s+')';
    stage.style.width=(1920*s)+'px';
    stage.style.height=(deck.scrollHeight*s)+'px';
  }
  window.addEventListener('resize',ajustar);
  window.addEventListener('load',ajustar);
  ajustar();
})();
</script>
