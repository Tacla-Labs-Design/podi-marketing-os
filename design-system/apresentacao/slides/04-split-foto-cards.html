<!-- 04-split-foto-cards — foto sangrando à esquerda, logo branco sobre ela, grade 2×2 de
     cards brancos à direita, passando por cima da foto. É o slide "Simplicidade / Conveniência /
     Engajamento / Inovação" do Figma. Não usa .slide__pad.

     A foto ocupa 1087 × 1080 (exportar 2174 × 2160) e precisa de uma área calma, média ou escura,
     onde o logo branco pousa: o centro da faixa de 794px que fica à mostra.
     Os ícones são marcadores de posição: trocar pelo do assunto (brand/assets/icones-bulk/).
     Para espelhar (foto à direita, cards à esquerda), acrescentar `split--dir` no <section>. -->
<style>
.split{display:block}
.split__foto{position:absolute;left:0;top:0;width:1087px;height:1080px;object-fit:cover;display:block}
.split__logo{position:absolute;left:266px;top:476px;width:263px}
.split__cards{position:absolute;right:0;top:0;width:1126px;height:1080px;padding:24px;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:24px}
.split__card{background:var(--surface);border-radius:var(--r-card);padding:40px;
  display:flex;flex-direction:column;gap:24px}
.split__card .t-card{margin-top:auto}
.split--dir .split__foto{left:auto;right:0}
.split--dir .split__cards{right:auto;left:0}
.split--dir .split__logo{left:auto;right:266px}
</style>
