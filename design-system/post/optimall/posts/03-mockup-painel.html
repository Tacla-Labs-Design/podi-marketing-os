<!-- 03-mockup-painel — produto em destaque: logo negativo + URL no topo, título grande em
     2 linhas e a tela do painel sangrando para o canto inferior direito.
     Troca: título (até 2 linhas de ~20 caracteres), a imagem do painel e o alt.
     A imagem é um PNG transparente de 1040 × 815 (2× = 2080 × 1630) já com a moldura da tela,
     recortado no ponto em que sai do canvas — outra tela precisa ser exportada no mesmo corte. -->
<style>
.pontos.mock-pontos-a,.pontos.mock-pontos-b{width:1445.76px;height:1080px;--pontos-cor:var(--lilas-pontos);
  background-image:radial-gradient(circle,var(--pontos-cor) 1.13px,transparent 1.45px);
  background-size:23.2823px 26.2855px;background-position:-10.51px -12.02px;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-position:0 0;mask-position:0 0}
.pontos.mock-pontos-a{left:-10px;top:16px;
  -webkit-mask-image:radial-gradient(822.5px 550.6px at 0 0,var(--branco),var(--branco-0));
          mask-image:radial-gradient(822.5px 550.6px at 0 0,var(--branco),var(--branco-0))}
.pontos.mock-pontos-b{right:0.24px;top:286px;
  -webkit-mask-image:radial-gradient(723px 1080px at 100% 100%,var(--branco),var(--branco-0));
          mask-image:radial-gradient(723px 1080px at 100% 100%,var(--branco),var(--branco-0))}
.mock-logo{left:66px;top:95px;width:326.466px}
.mock-url{right:68px;top:112px;font-size:31.3px;text-align:right;color:var(--lavanda)}
.mock-titulo{left:66px;top:248px;width:950px;color:var(--branco)}
.mock-tela{left:40px;top:535px;width:1040px;height:815px;display:block;z-index:1}
</style>
<section class="post post--roxo">
  <div class="pontos mock-pontos-a" aria-hidden="true"></div>
  <div class="pontos mock-pontos-b" aria-hidden="true"></div>
  <svg class="logo mock-logo" viewBox="0 0 143 24" role="img" aria-label="Optimall"><title>Optimall</title><use href="#logo-optimall-negativo"/></svg>
  <p class="t-url mock-url">www.optimall.com.br</p>
  <h1 class="t-titulo-lg mock-titulo">Soluções para<br>campanhas de prêmios</h1>
  <img class="mock-tela" src="assets/post-painel-campanha.png" alt="Tela do painel do Optimall com os detalhes de uma campanha promocional: participantes, créditos usados e regras">
</section>
