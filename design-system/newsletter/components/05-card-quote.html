<!-- 05 · CARD DESTAQUE + CITAÇÃO — card cinza com headline, quote, autoria e CTA. -->
<tr>
  <td class="p-mobile" style="padding:0 32px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#FFFFFF" class="dm-surface" style="width:100%;background-color:#FFFFFF;border-radius:20px;">
      <tr>
        <td align="center" class="card-mobile" style="padding:40px 32px 36px 32px;">
          <h2 class="t-h2 dm-ink" style="margin:0 0 20px 0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:26px;line-height:32px;font-weight:600;color:#101010;letter-spacing:-0.3px;text-align:center;">{{HEADLINE}}</h2>
          <p class="dm-body" style="margin:0 0 12px 0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:26px;font-weight:400;color:#4A4A4A;text-align:center;">&ldquo;{{CITACAO}}&rdquo;</p>
          <p class="dm-muted" style="margin:0 0 28px 0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:22px;font-weight:500;color:#6E6E6E;text-align:center;">&mdash; {{AUTOR}}</p>
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
            <tr>
              <td align="center" bgcolor="#31D06E" style="border-radius:100px;">
                <!--[if mso]>
                <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{URL_CTA}}" style="height:46px;v-text-anchor:middle;width:210px;" arcsize="50%" stroke="f" fillcolor="#31D06E">
                  <w:anchorlock/>
                  <center style="color:#101010;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;">{{LABEL_CTA}}</center>
                </v:roundrect>
                <![endif]-->
                <!--[if !mso]><!-->
                <a href="{{URL_CTA}}" target="_blank" style="display:inline-block;padding:15px 30px;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:16px;font-weight:600;color:#101010;text-decoration:none;border-radius:100px;background-color:#31D06E;mso-hide:all;">{{LABEL_CTA}}</a>
                <!--<![endif]-->
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>
